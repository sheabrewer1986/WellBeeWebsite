<!DOCTYPE html>
<html lang="en-us">

{% include head.html %}

<body class="subPageBody">
    <div class="headerBackground subPageHeaderBackground">
        <div class="container subPageContainer">
            {% include header.html %}

            <article class="page markdown-body blogArticle">
                <h1>{{ page.title }}</h1>

                <div class="blogArticleMeta">
                    <span class="blogArticleDate">
                        {{ page.date | date: "%d %B %Y" }}
                    </span>

                    {% for category in page.categories %}
                        <span class="blogCategory category-{{ category | slugify }}">
                            {{ category }}
                        </span>
                    {% endfor %}   
                </div>

                {{ content }}
            </article>
        </div>

        {% include appstoreimages.html %}
        {% include footer.html %}
    </div>
</body>

</html>
